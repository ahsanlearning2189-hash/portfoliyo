<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="demo.css"><title>Lumen Booking</title></head><body><p class="top"><a href="../index.php#projects">← Back to portfolio</a><small>Demo</small></p>
<h1>Lumen Booking</h1><div class="row"><input id="n" placeholder="Your name"><input type="date" id="d"><select id="t"><option>09:00</option><option>10:30</option><option>12:00</option><option>14:00</option><option>16:00</option></select><button onclick="b()">Book slot</button></div><p id="m"></p>
<table><tr><th>Name</th><th>Date</th><th>Time</th><th></th></tr><tbody id="l"></tbody></table>
<script>let B=JSON.parse(localStorage.lb||'[]');function r(){localStorage.lb=JSON.stringify(B);l.innerHTML=B.map((x,k)=>`<tr><td>${x.n.replace(/</g,'&lt;')}</td><td>${x.d}</td><td>${x.t}</td><td><button onclick="B.splice(${k},1);r()">Cancel</button></td></tr>`).join('')}
function b(){if(!n.value||!d.value){m.textContent='Enter a name and a date.';return}if(B.some(x=>x.d==d.value&&x.t==t.value)){m.textContent='That slot is taken. Pick another.';return}B.push({n:n.value,d:d.value,t:t.value});m.textContent='Booked!';r()}r()</script></body></html>
